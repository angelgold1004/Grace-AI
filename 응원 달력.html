<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>응원 달력</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 월 제목과 버튼 → 응원 친구 무대(캐릭터 + 말풍선) → 6주 고정 달력 → 선택한 날 정보. 달마다 색상(--h)이 바뀜 */
:root{
  --h:215;
  --font-display:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --bg:hsl(var(--h) 45% 98%);
  --fg:hsl(var(--h) 30% 13%);
  --muted:hsl(var(--h) 14% 38%);
  --faint:hsl(var(--h) 10% 52%);
  --line:hsl(var(--h) 28% 88%);
  --card:#ffffff;
  --tint:hsl(var(--h) 85% 93%);
  --accent:hsl(var(--h) 75% 52%);
  --accent-ink:hsl(var(--h) 70% 27%);
  --on-ink:#ffffff;
  --sun:hsl(2 72% 44%);
  --sun-tint:hsl(2 90% 95%);
  --sat:hsl(216 70% 44%);
  --ink:#3b2f3a;
  --shadow:rgba(40,30,50,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:hsl(var(--h) 20% 9%);
    --fg:hsl(var(--h) 20% 93%);
    --muted:hsl(var(--h) 12% 72%);
    --faint:hsl(var(--h) 8% 52%);
    --line:hsl(var(--h) 14% 22%);
    --card:hsl(var(--h) 16% 14%);
    --tint:hsl(var(--h) 30% 17%);
    --accent:hsl(var(--h) 70% 62%);
    --accent-ink:hsl(var(--h) 80% 80%);
    --on-ink:hsl(var(--h) 40% 12%);
    --sun:hsl(2 85% 72%);
    --sun-tint:hsl(2 40% 20%);
    --sat:hsl(216 90% 76%);
    --shadow:rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:hsl(var(--h) 20% 9%);
  --fg:hsl(var(--h) 20% 93%);
  --muted:hsl(var(--h) 12% 72%);
  --faint:hsl(var(--h) 8% 52%);
  --line:hsl(var(--h) 14% 22%);
  --card:hsl(var(--h) 16% 14%);
  --tint:hsl(var(--h) 30% 17%);
  --accent:hsl(var(--h) 70% 62%);
  --accent-ink:hsl(var(--h) 80% 80%);
  --on-ink:hsl(var(--h) 40% 12%);
  --sun:hsl(2 85% 72%);
  --sun-tint:hsl(2 40% 20%);
  --sat:hsl(216 90% 76%);
  --shadow:rgba(0,0,0,.4);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-block:10px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:background-color .5s ease;
}
.app{max-width:440px;margin:0 auto}
button{font-family:inherit}

/* 상단 */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.titles{min-width:0}
.year{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.month{margin:0;font-family:var(--font-display);font-weight:400;font-size:48px;line-height:1.05;color:var(--accent-ink)}
.nav{display:flex;align-items:center;gap:8px;padding-bottom:6px}
.icon{appearance:none;border:0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--accent-ink);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.icon:active{transform:scale(.94)}
.pill{appearance:none;font-size:13px;font-weight:700;height:40px;padding:0 15px;border-radius:999px;border:1.5px solid var(--accent-ink);color:var(--accent-ink);background:transparent;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pill:active{transform:scale(.96)}
.icon:focus-visible,.pill:focus-visible,.day:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}

/* 무대 */
.stage{position:relative;display:grid;grid-template-columns:120px minmax(0,1fr);align-items:end;gap:8px;margin-top:12px;padding:20px 14px 14px 8px;border-radius:30px;background:var(--tint);overflow:hidden;isolation:isolate;transition:background-color .5s ease}
.fx{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.p{position:absolute;width:var(--s);height:var(--s);color:var(--accent);opacity:.55;will-change:transform}
.p svg{display:block;width:100%;height:100%}
.p.fall{top:-26px;animation:fall var(--d) linear var(--dl) infinite}
.p.rise{bottom:-26px;animation:rise var(--d) linear var(--dl) infinite}
.p.twinkle{animation:twinkle 2.6s ease-in-out var(--dl) infinite alternate}
@keyframes fall{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--sx),280px) rotate(300deg)}}
@keyframes rise{from{transform:translate(0,0)}to{transform:translate(var(--sx),-280px)}}
@keyframes twinkle{from{transform:scale(.4) rotate(0);opacity:.15}to{transform:scale(1.1) rotate(25deg);opacity:.7}}

.hero{position:relative;z-index:1;appearance:none;border:0;background:none;padding:0;margin:0;width:120px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border-radius:24px}
.hero:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px}
.hero.jump{animation:jump .6s cubic-bezier(.3,1.6,.5,1)}
.hero.enter{animation:enter .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}28%{transform:translateY(-18px) scale(.96,1.05)}62%{transform:translateY(0) scale(1.05,.95)}100%{transform:none}}
@keyframes enter{from{transform:scale(.7) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.char{display:block;width:100%;height:auto;overflow:visible}
.o{stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.bob{animation:bob 1.1s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.arm{will-change:transform}
.arm.L{transform-origin:62px 126px;transform:rotate(140deg);animation:armL .62s ease-in-out infinite alternate}
.arm.R{transform-origin:138px 126px;transform:rotate(-140deg);animation:armR .62s ease-in-out infinite alternate}
@keyframes armL{from{transform:rotate(120deg)}to{transform:rotate(156deg)}}
@keyframes armR{from{transform:rotate(-156deg)}to{transform:rotate(-120deg)}}
.mouth{transform-box:fill-box;transform-origin:50% 0;animation:talk .42s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

.bubble{position:relative;z-index:1;min-height:168px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;background:var(--card);border-radius:24px;padding:16px 16px 12px;box-shadow:0 8px 20px -14px var(--shadow)}
.bubble::before{content:"";position:absolute;left:-7px;bottom:42px;width:16px;height:16px;background:var(--card);transform:rotate(45deg);border-radius:4px}
.cheer{margin:0 0 6px;font-family:var(--font-display);font-size:22px;line-height:1.25;color:var(--accent-ink);text-wrap:balance;word-break:keep-all}
.dream{margin:0;font-size:14px;line-height:1.6;color:var(--fg);word-break:keep-all}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 10px;font-size:12px;color:var(--muted)}
.friend{font-weight:700}
.spk{position:absolute;z-index:2;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;background:var(--accent);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);pointer-events:none;animation:spk .7s ease-out forwards}
@keyframes spk{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}

/* 달력 */
.cal{margin-top:16px}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px}
.dow span:first-child{color:var(--sun)}
.dow span:last-child{color:var(--sat)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.grid.in-r{animation:inr .28s ease-out}
.grid.in-l{animation:inl .28s ease-out}
@keyframes inr{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes inl{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.day{appearance:none;border:0;background:none;font:inherit;color:var(--fg);height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:14px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.day .n{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;font-size:15px;font-variant-numeric:tabular-nums}
.day .dot{width:4px;height:4px;border-radius:50%;background:var(--sun);visibility:hidden}
.day.hol .dot{visibility:visible}
.day.sun{color:var(--sun)}
.day.sat{color:var(--sat)}
.day.out{color:var(--faint)}
.day.out .n{opacity:.7}
.day.sel{background:var(--tint)}
.day.sel .n{box-shadow:0 0 0 2px var(--accent)}
.day.today .n{background:var(--accent-ink);color:var(--on-ink);font-weight:700}

.detail{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:12px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);min-height:52px}
.detail b{font-family:var(--font-display);font-weight:400;font-size:18px}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--tint);color:var(--accent-ink)}
.chip.hol{background:var(--sun-tint);color:var(--sun)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .p.fall,.p.rise{top:var(--y0);bottom:auto}
  .spk{display:none}
}
</style>

<main class="app" id="app">
  <header class="top">
    <div class="titles">
      <div class="year" id="year"></div>
      <h1 class="month" id="monthName"></h1>
    </div>
    <nav class="nav" aria-label="월 이동">
      <button class="icon" id="prev" type="button" aria-label="이전 달"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="pill" id="today" type="button">오늘</button>
      <button class="icon" id="next" type="button" aria-label="다음 달"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </nav>
  </header>

  <section class="stage" id="stage" aria-label="이번 달 응원 친구">
    <div class="fx" id="fx" aria-hidden="true"></div>
    <button class="hero" id="hero" type="button" aria-label="응원 친구를 눌러 다음 이야기 듣기"><span id="charWrap"></span></button>
    <div class="bubble" id="bubble" aria-live="polite">
      <div>
        <p class="cheer" id="cheer"></p>
        <p class="dream" id="dream"></p>
      </div>
      <div class="foot"><span class="friend" id="friend"></span><span>탭하면 다음 이야기</span></div>
    </div>
  </section>

  <section class="cal" aria-label="달력">
    <div class="dow" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="grid" id="grid"></div>
  </section>

  <footer class="detail" id="detail"></footer>
</main>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
document.documentElement.lang='ko';

var DOW=['일','월','화','수','목','금','토'];

/* 공휴일: 양력 고정 공휴일은 매년, 설날·부처님오신날·추석·대체공휴일·선거일은 2026년만 담았음 */
var HOL_FIXED={'1-1':'신정','3-1':'삼일절','5-5':'어린이날','6-6':'현충일','8-15':'광복절','10-3':'개천절','10-9':'한글날','12-25':'성탄절'};
var HOL_2026={'2026-2-16':'설날 연휴','2026-2-17':'설날','2026-2-18':'설날 연휴','2026-3-2':'대체공휴일','2026-5-24':'부처님오신날','2026-5-25':'대체공휴일','2026-6-3':'지방선거일','2026-8-17':'대체공휴일','2026-9-24':'추석 연휴','2026-9-25':'추석','2026-9-26':'추석 연휴','2026-10-5':'대체공휴일'};
function holiday(y,m,d){var k=(m+1)+'-'+d;return HOL_FIXED[k]||HOL_2026[y+'-'+k]||'';}

/* ---------- 월별 응원 친구 ---------- */
var MONTHS=[
{friend:'펭이',animal:'펭귄',h:215,fx:'snow',
 cheers:['새해 첫걸음, 화이팅!','시작이 반이에요!','올해도 아자아자!'],
 dreams:['저는 가장 추운 곳에서도 마음만은 따뜻한 펭귄이 되는 게 꿈이에요. 올해 당신의 꿈은 무엇인가요?','얼음 위에서 넘어져도 다시 일어나면 돼요. 저는 올해 멋진 미끄럼틀을 만들 거예요!','해돋이를 보며 소원을 빌었어요. 당신의 꿈이 올해 한 뼘 더 자라길 응원해요.']},
{friend:'곰실이',animal:'곰',h:285,fx:'snow',
 cheers:['조금만 더, 화이팅!','봄이 오고 있어요!','포근하게 힘내요!'],
 dreams:['겨울잠에서 깨면 가장 먼저 꽃구경을 갈 거예요. 제 꿈은 봄 소풍 도시락을 나눠 먹는 거예요.','쉬어가는 것도 용기예요. 충분히 쉬고 나면 꿈에 더 가까이 갈 수 있어요.','저는 꿀 한 통을 가득 채우는 게 꿈이에요. 한 방울씩, 당신도 잘하고 있어요!']},
{friend:'토롱이',animal:'토끼',h:135,fx:'leaf',
 cheers:['새 학기, 화이팅!','새싹처럼 쑥쑥!','폴짝폴짝 힘내요!'],
 dreams:['저는 달까지 폴짝 뛰어가는 게 꿈이에요. 한 걸음이 모이면 어디든 갈 수 있어요!','새싹은 작지만 매일 자라요. 오늘 하루도 당신의 꿈이 자라는 날이에요.','처음은 누구나 서툴러요. 서툰 지금이 꿈의 가장 반짝이는 시작이에요.']},
{friend:'삐용이',animal:'병아리',h:330,fx:'petal',
 cheers:['벚꽃처럼 활짝!','삐약삐약 화이팅!','오늘도 반짝반짝!'],
 dreams:['저는 언젠가 하늘 높이 날아오르는 게 꿈이에요. 아직 작은 날개지만 매일 연습 중이에요!','꽃은 때가 되면 피어요. 당신의 꿈도 곧 활짝 필 거예요.','넘어져도 괜찮아요. 저도 오늘만 열두 번 넘어졌는걸요. 삐약!']},
{friend:'몽이',animal:'강아지',h:10,fx:'petal',
 cheers:['신나게 달려요!','오늘도 멍멍 화이팅!','푸르게 힘내요!'],
 dreams:['제 꿈은 온 세상 공원을 다 달려 보는 거예요. 당신이 꿈꾸는 곳은 어디인가요?','5월의 햇살처럼 따뜻한 하루 보내세요. 당신은 이미 충분히 잘하고 있어요.','저는 소중한 사람 곁에 오래 있고 싶어요. 함께하는 사람들과 꿈을 이뤄 가요!']},
{friend:'개굴이',animal:'개구리',h:170,fx:'drop',
 cheers:['비 와도 화이팅!','개굴개굴 힘내요!','콩콩 뛰어봐요!'],
 dreams:['비가 오면 연못이 노래해요. 제 꿈은 큰 무대에서 개굴 합창을 하는 거예요!','궂은 날이 있어야 무지개가 떠요. 지금의 노력이 곧 무지개가 될 거예요.','우산이 없어도 괜찮아요. 저는 비를 맞으며 더 멀리 뛰는 법을 배웠어요.']},
{friend:'푸루',animal:'고래',h:200,fx:'bubble',
 cheers:['파도처럼 힘차게!','시원하게 화이팅!','풍덩 도전해요!'],
 dreams:['제 꿈은 바다 끝까지 노래를 전하는 거예요. 당신의 목소리도 멀리멀리 닿을 거예요.','더울 땐 잠깐 쉬어가요. 숨을 고르고 나면 더 멀리 헤엄칠 수 있어요.','깊은 바다엔 보물이 있어요. 당신의 꿈도 용기 낸 만큼 깊어져요!']},
{friend:'해바',animal:'사자',h:52,fx:'spark',
 cheers:['해처럼 뜨겁게!','으르렁 화이팅!','여름도 내 편!'],
 dreams:['제 꿈은 해바라기 들판의 대장이 되는 거예요. 늘 해를 바라보면 흐린 날도 괜찮아요.','뜨거운 만큼 단단해져요. 오늘 흘린 땀방울이 꿈의 씨앗이 될 거예요.','용기는 크게 소리치는 게 아니에요. 오늘도 해냈다는 것, 그게 진짜 용기예요.']},
{friend:'여리',animal:'여우',h:255,fx:'spark',
 cheers:['보름달처럼 환하게!','한가위 화이팅!','살랑살랑 힘내요!'],

function pth(d,fill,sw){return '<path class="o" d="'+d+'" fill="'+fill+'"'+(sw?' stroke-width="'+sw+'"':'')+'/>';}
function plain(d,stroke,w,op){return '<path d="'+d+'" fill="none" stroke="'+stroke+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"'+(op?' opacity="'+op+'"':'')+'/>';}

}
function assemble(c,label){
  var s='<svg class="char" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+label+'">';
  s+='<ellipse cx="100" cy="191" rx="48" ry="6" fill="var(--shadow)"/>';

    var a=(i/9)*Math.PI*2+Math.random()*.4,r=44+Math.random()*34,el=document.createElement('i');
    el.className='spk';el.style.left=cx+'px';el.style.top=cy+'px';
    el.style.setProperty('--dx',(Math.cos(a)*r).toFixed(1)+'px');el.style.setProperty('--dy',(Math.sin(a)*r).toFixed(1)+'px');
    st.appendChild(el);
    (function(e){setTimeout(function(){if(e.parentNode)e.parentNode.removeChild(e);},800);})(el);
  }
}
function cheerAgain(){ci++;di++;fillSpeech(true);anim($('hero'),'jump');burst();}

function renderHead(){$('year').textContent=view.y+'년';$('monthName').textContent=(view.m+1)+'월';}
function renderGrid(dir){
  var first=new Date(view.y,view.m,1).getDay(),html='';
  for(var i=0;i<42;i++){
    var dt=new Date(view.y,view.m,1-first+i),y=dt.getFullYear(),m=dt.getMonth(),d=dt.getDate(),col=i%7;
    var hol=holiday(y,m,d),cls=['day'];
    if(m!==view.m)cls.push('out');
    if(col===0||hol)cls.push('sun');else if(col===6)cls.push('sat');
    if(hol)cls.push('hol');
    var isToday=(y===T.y&&m===T.m&&d===T.d),isSel=(y===sel.y&&m===sel.m&&d===sel.d);
    if(isToday)cls.push('today');
    if(isSel)cls.push('sel');
    html+='<button type="button" class="'+cls.join(' ')+'" data-y="'+y+'" data-m="'+m+'" data-d="'+d+'" aria-pressed="'+isSel+'" aria-label="'+(m+1)+'월 '+d+'일 '+DOW[col]+'요일'+(hol?', '+hol:'')+(isToday?', 오늘':'')+'"><span class="n">'+d+'</span><span class="dot"></span></button>';
  }
  var g=$('grid');g.innerHTML=html;
  if(dir){anim(g,dir>0?'in-r':'in-l');}
}
function renderDetail(){
  var dt=new Date(sel.y,sel.m,sel.d),hol=holiday(sel.y,sel.m,sel.d);
  var diff=Math.round((Date.UTC(sel.y,sel.m,sel.d)-Date.UTC(T.y,T.m,T.d))/86400000),rel='';
  if(diff===0)rel='오늘';else if(diff===1)rel='내일';else if(diff===-1)rel='어제';else if(diff>1)rel=diff+'일 뒤';else rel=(-diff)+'일 전';
  $('detail').innerHTML='<b>'+(sel.y!==T.y?sel.y+'년 ':'')+(sel.m+1)+'월 '+sel.d+'일 '+DOW[dt.getDay()]+'요일</b><span class="chip">'+rel+'</span>'+(hol?'<span class="chip hol">'+hol+'</span>':'');
}
function select(y,m,d,dir){
  var moved=(y!==view.y||m!==view.m);
  sel={y:y,m:m,d:d};view={y:y,m:m};
  renderHead();
  if(m!==stageM)renderStage();
  renderGrid(moved?dir:0);
  renderDetail();
}
function go(delta){
  var y=view.y,m=view.m+delta;
  while(m<0){m+=12;y--;}
  while(m>11){m-=12;y++;}
  var dim=new Date(y,m+1,0).getDate();
  select(y,m,Math.min(sel.d,dim),delta);
}

/* ---------- 이벤트 ---------- */
$('prev').addEventListener('click',function(){go(-1);});
$('next').addEventListener('click',function(){go(1);});
$('today').addEventListener('click',function(){
  if(view.y===T.y&&view.m===T.m&&sel.d===T.d&&sel.m===T.m&&sel.y===T.y){cheerAgain();return;}
  var diff=(T.y*12+T.m)-(view.y*12+view.m);
  select(T.y,T.m,T.d,diff>0?1:-1);
});
$('hero').addEventListener('click',cheerAgain);
$('bubble').addEventListener('click',cheerAgain);
$('grid').addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('.day'):null;if(!b)return;
  var y=+b.getAttribute('data-y'),m=+b.getAttribute('data-m'),d=+b.getAttribute('data-d');
  var diff=(y*12+m)-(view.y*12+view.m);
  select(y,m,d,diff>0?1:-1);
});
var app=$('app'),tx=0,ty=0,tt=0;
app.addEventListener('touchstart',function(e){var t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;tt=Date.now();},{passive:true});
app.addEventListener('touchend',function(e){var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;if(Math.abs(dx)>56&&Math.abs(dx)>Math.abs(dy)*1.6&&Date.now()-tt<700){go(dx<0?1:-1);}},{passive:true});
document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')go(-1);else if(e.key==='ArrowRight')go(1);});
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  var n=new Date();
  if(n.getDate()!==T.d||n.getMonth()!==T.m||n.getFullYear()!==T.y){T={y:n.getFullYear(),m:n.getMonth(),d:n.getDate()};renderGrid(0);renderDetail();}
});

select(T.y,T.m,T.d,0);
})();
</script>

</body></html>
